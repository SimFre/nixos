# Klipper config for Ender 3 v2 (board 4.2.2, STM32F103) + CR Touch
# Derived from the mriscoc M503 dump of 2026-10-12.
# CHECK BEFORE FIRST MOVE: endstop direction (QUERY_ENDSTOPS), probe (QUERY_PROBE),
# motor directions, thermistors. Use M112 / the emergency stop button if anything looks wrong.

[mcu]
# Find the real path with: ls /dev/serial/by-id/
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 1500
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5.0

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: 230
homing_speed: 50

# Single Z driver. This is correct if both Z motors share the one Z port
# (splitter / Y-cable), which is how most dual-Z kits are wired.
# If the second motor has its own driver, say so and I'll add [stepper_z1].
[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -5

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
# 3200 / 93 steps/mm from your M92 E93.00. Calibrate later.
rotation_distance: 34.409
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
#control: pid
# Placeholder values; run PID_CALIBRATE HEATER=extruder TARGET=210
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114
min_temp: 0
max_temp: 275
# Marlin retract was 5 mm; start lower for direct drive/Bowden as appropriate.

[heater_bed]
heater_pin: PA2
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
#control: pid
# From your M304 (Marlin PID values are compatible)
#pid_Kp: 169.30
#pid_Ki: 29.39
#pid_Kd: 650.13
min_temp: 0
max_temp: 130

[heater_fan hotend_fan]
pin: PC0
heater: extruder
heater_temp: 50.0

[fan]
pin: PA0

[bltouch]
sensor_pin: ^PB1
control_pin: PB0
# From your M851 (X-41.5 Y-7 Z-0.85). Marlin negative Z offset becomes positive here.
# Re-do with PROBE_CALIBRATE; do not trust this number.
x_offset: -41.5
y_offset: -7.0
#z_offset: 0.85
speed: 5.0
samples: 2
sample_retract_dist: 3.0
samples_result: median

[safe_z_home]
# Nozzle coordinates that put the probe at the bed centre
home_xy_position: 159, 124
speed: 100
z_hop: 10
z_hop_speed: 10

[bed_mesh]
speed: 150
horizontal_move_z: 5
# Probe coordinates (not nozzle). Stays within the probe's reachable area.
mesh_min: 30, 10
mesh_max: 190, 220
probe_count: 5, 5
algorithm: bicubic

[virtual_sdcard]
# path: ~/printer_data/gcodes
path: /var/lib/moonraker/gcodes

[display_status]
[pause_resume]

[idle_timeout]
timeout: 1800

[gcode_macro START_PRINT]
gcode:
    {% set BED = params.BED|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(210)|float %}
    M140 S{BED}
    M104 S{EXTRUDER}
    G28
    M190 S{BED}
    BED_MESH_PROFILE LOAD=default
    M109 S{EXTRUDER}
    G92 E0
    G1 Z2 F300
    G1 X10 Y20 Z0.3 F5000
    G1 X10 Y150 Z0.3 E15 F1500
    G92 E0
    G1 Z2 F300

[gcode_macro END_PRINT]
gcode:
    G91
    G1 E-3 F1800
    G1 Z10 F600
    G90
    G1 X10 Y220 F6000
    M104 S0
    M140 S0
    M107
    M84

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set E = params.E|default(3)|float %}
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-{E} F2100
    G1 Z10 F900
    G90
    G1 X10 Y220 F6000

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% set E = params.E|default(3)|float %}
    G91
    G1 E{E} F2100
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    BASE_RESUME

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    M107
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    G91
    G1 Z10 F600
    G90
    G1 X10 Y220 F6000
    M84
    BASE_CANCEL_PRINT

